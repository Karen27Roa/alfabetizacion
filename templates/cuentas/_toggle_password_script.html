<script>
  (function () {
    function inicializarTogglePassword() {
      const botones = document.querySelectorAll('.btn-toggle-password');
      botones.forEach(function (btn) {
        if (btn.dataset.toggleBound === 'true') return;
        btn.dataset.toggleBound = 'true';

        btn.addEventListener('click', function () {
          const grupo = btn.closest('.input-group');
          if (!grupo) return;
          const input = grupo.querySelector('input');
          if (!input) return;

          const esPassword = input.type === 'password';
          input.type = esPassword ? 'text' : 'password';

          const ojoAbierto = btn.querySelector('.icono-ojo-abierto');
          const ojoTachado = btn.querySelector('.icono-ojo-tachado');
          if (ojoAbierto && ojoTachado) {
            ojoAbierto.classList.toggle('d-none', esPassword);
            ojoTachado.classList.toggle('d-none', !esPassword);
          }

          const etiqueta = esPassword ? 'Ocultar contraseña' : 'Mostrar contraseña';
          btn.setAttribute('aria-label', etiqueta);
          btn.setAttribute('title', etiqueta);
        });
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', inicializarTogglePassword);
    } else {
      inicializarTogglePassword();
    }
    document.addEventListener('htmx:afterSettle', inicializarTogglePassword);
  })();
</script>
