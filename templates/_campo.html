<div class="mb-3">
  <label class="form-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
  {% if campo.field.widget.input_type == 'password' %}
    <div class="input-group">
      {{ campo }}
      <button class="btn btn-outline-secondary btn-toggle-password" type="button" aria-label="Mostrar contraseña" title="Mostrar contraseña">
        <!-- Ícono ojito abierto (cuando está oculta) -->
        <svg class="icono-ojo icono-ojo-abierto" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/>
          <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
        </svg>
        <!-- Ícono ojito tachado (cuando está visible) -->
        <svg class="icono-ojo icono-ojo-tachado d-none" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7 7 0 0 0-2.79.588l.77.771A6 6 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755q-.247.248-.517.486z"/>
          <path d="M11.297 9.124a3.5 3.5 0 0 0-4.42-4.42l1.01 1.01a2.5 2.5 0 0 1 2.4 2.4z"/>
          <path d="M1.323 1.066l13.61 13.61-.707.708-1.505-1.505A8.7 8.7 0 0 1 8 14.5c-5 0-8-5.5-8-5.5a14 14 0 0 1 2.378-2.923L.616 1.774l.707-.708zm2.493 3.908A12.7 12.7 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c1.47 0 2.822-.556 3.923-1.478l-1.077-1.077A3.5 3.5 0 0 1 6.13 6.049z"/>
        </svg>
      </button>
    </div>
  {% else %}
    {{ campo }}
  {% endif %}
  {% for e in campo.errors %}<div class="campo-error">{{ e }}</div>{% endfor %}
  {% if campo.help_text and not campo.errors %}<div class="form-text small">{{ campo.help_text|safe }}</div>{% endif %}
</div>
